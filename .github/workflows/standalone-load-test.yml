name: Standalone Load Test
on:
  workflow_dispatch:
    inputs:
      wss_url:
        description: 'Target WebSocket URL (e.g., wss://...)'
        required: true
        type: string
      load_level:
        description: 'Select Load Level to run'
        required: true
        type: choice
        options:
          - medium_load
          - full_load

env:
  NODE_VERSION: 24

jobs:
  load-test:
    name: Load Test ${{ inputs.load_level }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Load Suite
        env:
          WSS_URL: ${{ inputs.wss_url }}
        run: |
          mkdir -p reports
          npx artillery run \
            -e ${{ inputs.load_level }} \
            --output "reports/${{ inputs.load_level }}.json" \
            tests/load_tests/load_test.yaml

      - name: Upload Load Test Reports
        uses: actions/upload-artifact@v7
        if: always() # Ensure reports are uploaded even if the test fails
        with:
          name: standalone-artillery-report-${{ inputs.load_level }}
          path: reports/
          retention-days: 7
