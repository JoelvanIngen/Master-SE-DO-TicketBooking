name: Build & Deploy to AWS Lambda

on:
  workflow_dispatch:
  push:
    branches: ["main", "ci_cd"]
    paths:
      - 'booking-service-java/**'
      - '.github/workflows/deploy_booking-service.yml' # Also run if this config changes
  pull_request:
    branches: ["main"]
    paths:
      - 'booking-service-java/**'
      - '.github/workflows/deploy_booking-service.yml' # Also run if this config changes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build Java Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project with Maven
        working-directory: ./booking-service-java
        run: mvn clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: booking-service-jar
          path: booking-service-java/target/booking-service-lambda.jar
          retention-days: 1

  deploy:
    name: Deploy to AWS
    needs: build
    # We might at some point want to start disallowing pr deploy
    #if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read  # Required to check out the repository

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v8
        with:
          name: booking-service-jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-north-1  # The role-to-assume should be the ARN of the IAM role you created for GitHub Actions OIDC

      - name: Deploy to AWS Lambda using CLI (RetrievePayment)
        run: |
          aws lambda update-function-code \
            --function-name retrievePayment \
            --zip-file fileb://booking-service-lambda.jar
      
      - name: Deploy to AWS Lambda using CLI (PaymentResponse)
        run: |
          aws lambda update-function-code \
            --function-name PaymentResponseHandler \
            --zip-file fileb://booking-service-lambda.jar
      
      - name: Deploy to AWS Lambda using CLI (GenTicket)
        run: |
          aws lambda update-function-code \
            --function-name GenerateTicketHandler \
            --zip-file fileb://booking-service-lambda.jar
