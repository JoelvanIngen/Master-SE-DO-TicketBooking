name: Deploy ticketGen to AWS Lambda

on:
  push:
    branches: [ "main", "ci_cd" ]
    paths:
      - 'fake-services-nodejs/src/ticketGen.ts'   # only run if the booking service changed
      - 'fake-services-nodejs/package.json'
      - 'fake-services-nodejs/tsconfig.json'
      - '.github/workflows/deploy_ticketGen.yml'  # Also run if this config changes
      - '.github/workflows/deploy_node-generic.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'fake-services-nodejs/src/ticketGen.ts'   # only run if the booking service changed
      - 'fake-services-nodejs/package.json'
      - 'fake-services-nodejs/tsconfig.json'
      - '.github/workflows/deploy_ticketGen.yml'  # Also run if this config changes
      - '.github/workflows/deploy_node-generic.yml'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  call-deploy:
    uses: '.github/workflows/deploy_node-generic.yml'
    with:
      aws_region: ${{ env.AWS_REGION }}
      entry_point: 'src/ticketGen.ts'
      lambda_function_name: 'ticketGen'
      service_name: 'ticketGen'
      working_directory: 'fake-services-nodejs'
    secrets: inherit
